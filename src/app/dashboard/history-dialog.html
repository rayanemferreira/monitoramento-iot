<div mat-dialog-title class="title-row">
  <h2>Histórico — {{ data.name | titlecase }}</h2>
  <div class="actions">

  <button mat-flat-button color="primary" class="cta" (click)="close()">
    Fechar
  </button>
  </div>
</div>
<div class="dialog-body">
  <div class="chart-wrapper">
    @if (isBrowser) {
    <canvas baseChart [type]="'line'" [data]="chartData" [options]="lineOptions"></canvas>
    }
  </div>
  <div class="legend">1 = ligado, 0 = desligado</div>
  
</div>
